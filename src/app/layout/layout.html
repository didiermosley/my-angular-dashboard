<div class="shell">
  <div class="backdrop" [class.open]="drawerOpen()" (click)="closeDrawer()"></div>

  <aside class="sidebar" [class.open]="drawerOpen()">
    <div class="brand">
      <div class="brand-mark">O</div>
      <div class="brand-name">Orbital</div>
      <button class="drawer-close" (click)="closeDrawer()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>

    <nav>
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" (click)="closeDrawer()">
          <app-nav-icon [name]="item.path" />
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="spacer"></div>

    <div class="theme-picker">
      <div class="theme-label">Theme</div>
      <div class="swatches">
        @for (name of theme.names; track name) {
          <button
            class="swatch"
            [class.active]="theme.current() === name"
            [style.background]="paletteAccent(name)"
            (click)="theme.set(name)"
          ></button>
        }
      </div>
    </div>

    <div class="profile">
      <div class="avatar">JC</div>
      <div>
        <div class="name">Jordan Cole</div>
        <div class="role">Admin</div>
      </div>
    </div>
  </aside>

  <main class="content">
    <div class="scroll" #scrollEl (scroll)="onScroll($event)">
      <header class="desktop-bar">
        <div>
          <div class="title">{{ active().label }}</div>
          <div class="subtitle">{{ active().subtitle }}</div>
        </div>
        <div class="bell">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2">
            <path d="M18 8a6 6 0 10-12 0c0 3-1.2 4.5-2 5.5h16c-.8-1-2-2.5-2-5.5z" />
            <path d="M9.5 17a2.5 2.5 0 005 0" />
          </svg>
        </div>
      </header>

      <header class="mobile-bar" [class.hidden]="headerHidden()" [class.scrolled]="scrolled()">
        <div class="left">
          <div class="brand-mark">O</div>
          <button class="icon-btn" (click)="openDrawer()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
        </div>
        <button class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8a6 6 0 10-12 0c0 3-1.2 4.5-2 5.5h16c-.8-1-2-2.5-2-5.5z" />
            <path d="M9.5 17a2.5 2.5 0 005 0" />
          </svg>
        </button>
      </header>

      <div class="page-heading">
        <div class="title">{{ active().label }}</div>
        <div class="subtitle">{{ active().subtitle }}</div>
      </div>

      <router-outlet />
    </div>
  </main>
</div>
