<section class="reports">
  @for (r of rows; track r.title) {
    <div class="report-row">
      <div class="left">
        <div class="icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2">
            <path d="M6 3h9l4 4v14H6z" />
            <path d="M15 3v4h4" />
            <path d="M9 13h6M9 16.5h6" />
          </svg>
        </div>
        <div>
          <div class="strong">{{ r.title }}</div>
          <div class="faint">{{ r.period }} &middot; generated {{ r.date }}</div>
        </div>
      </div>
      <div class="download">Download</div>
    </div>
  }
</section>
